# =============================================================================
# DistinctionOS Steam Linker Configuration
# =============================================================================
# This file contains the default configuration for Steam Linker.
#
# Override hierarchy:
#   1. /usr/share/distinctionos/steam-linker/steam-linker.conf (this file)
#   2. /usr/local/share/distinctionos/steam-linker/steam-linker.conf
#   3. ~/.config/distinctionos/steam-linker.conf
#
# To customise, create ~/.config/distinctionos/steam-linker.conf with your
# preferred values. Do not edit this file directly as it will be overwritten
# on system updates.
# =============================================================================

# Directory where game symlinks will be created
# Default: ~/Games/Steamlibrary
STEAM_LINKER_TARGET_DIR="${HOME}/Games/Steamlibrary"

# Path to Steam's library configuration file
# This is where Steam stores information about all library locations
# Default: ~/.local/share/Steam/steamapps/libraryfolders.vdf
STEAM_LINKER_VDF_PATH="${HOME}/.local/share/Steam/steamapps/libraryfolders.vdf"

# Exclusion patterns (extended regex, pipe-separated)
# Directories matching these patterns will NOT be symlinked
# This filters out Proton compatibility tools, Steam runtimes, and other
# non-game items that appear in steamapps/common
#
# Default patterns exclude:
#   - Proton versions (Proton 8.0, Proton Experimental, Proton-8.0, etc.)
#   - GE-Proton (community Proton builds)
#   - SteamLinuxRuntime (soldier, sniper, etc.)
#   - Steam Controller Configs
#   - Steamworks Shared
#   - Backup directories ending in .bak (e.g., "Fallout 4.bak")
#
# To add your own exclusions, override this in your user config:
#   STEAM_LINKER_EXCLUDE_PATTERNS="^Proton |^MyCustomExclusion"
#
# To disable all exclusions:
#   STEAM_LINKER_EXCLUDE_PATTERNS=""
STEAM_LINKER_EXCLUDE_PATTERNS="^Proton |^Proton-|^GE-Proton|^SteamLinuxRuntime|^Steam Controller Configs$|^Steamworks Shared$|^Steam Linux Runtime|\.bak$"

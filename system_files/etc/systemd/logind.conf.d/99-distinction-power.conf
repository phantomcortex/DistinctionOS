# Logind Configuration Override for DistinctionOS
# Location: /etc/systemd/logind.conf.d/99-distinction-power.conf
#
# This configures the power button to use our custom handler
# instead of the default suspend action

[Login]
HandlePowerKey=suspend
HandlePowerKeyLongPress=shutdown

# Keep suspend behavior for lid close
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore

# Shorter idle timeout before sleep inhibitors are ignored (optional)
# Uncomment if you want inhibitors to be forcibly overridden after 30 seconds
InhibitDelayMaxSec=30

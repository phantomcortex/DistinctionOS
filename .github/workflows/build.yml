---
name: Build DistinctionOS
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '05 6 */5 * *'  # 12:05am Mountain time every 5 days
  push:
    branches:
      - main
      - '**'
    paths-ignore:
      - '.github/**'
      - '**/README.md'
      - '**/claude.md'
      - 'repo_files/**'
      - 'system_files/**'
  workflow_dispatch:
    inputs:
      fresh-rechunk:
        description: 'Clear rechunk history (forces full redownload for users)'
        type: boolean
        default: false
      handwritten:
        description: 'Optional handwritten changelog message for this release'
        type: string
        default: ''

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  IMAGE_KEYWORDS: "bootc,ublue,universal-blue"
  IMAGE_LOGO_URL: "https://avatars.githubusercontent.com/u/120078124?s=200&v=4"

jobs:

  # ============================================================================
  # Build matrix — GNOME desktop + Deck variants
  # ============================================================================
  build:
    name: Build — ${{ matrix.variant }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: gnome
            image_name: distinctionos
            image_desc: "DistinctionOS — GNOME gaming desktop"
            containerfile: Containerfile.gnome
            base_image_name: bazzite-gnome
            rechunk: true

          - variant: deck
            image_name: distinctionos-deck
            image_desc: "DistinctionOS — Deck / gaming mode"
            containerfile: Containerfile.deck
            base_image_name: bazzite-deck
            rechunk: false

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ matrix.variant }}
      cancel-in-progress: true

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          fetch-depth: 0

      # ── Environment ─────────────────────────────────────────────────────────
      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}

      - name: Get current date
        id: date
        run: |
          echo "date=$(date -u +%Y\-%m\-%d\T%H\:%M\:%S\Z)" >> $GITHUB_OUTPUT
          echo "version_date=$(date -u +%Y%m%d)" >> $GITHUB_OUTPUT

      # ── Tags ────────────────────────────────────────────────────────────────
      # Tag scheme:
      #   gnome  + main     ->  latest  latest.YYYYMMDD  YYYYMMDD
      #   gnome  + non-main ->  testing
      #   deck   + main     ->  deck-latest  deck-latest.YYYYMMDD  deck-YYYYMMDD
      #   deck   + non-main ->  deck-testing
      - name: Compute image tags
        id: tags
        run: |
          IS_MAIN="${{ github.ref == 'refs/heads/main' }}"
          IS_PR="${{ github.event_name == 'pull_request' }}"
          DATE="${{ steps.date.outputs.version_date }}"
          VARIANT="${{ matrix.variant }}"

          if [[ "$IS_PR" == "true" ]]; then
            TAGS="pr-${{ github.event.number }}"
          elif [[ "$IS_MAIN" == "true" ]]; then
            if [[ "$VARIANT" == "gnome" ]]; then
              TAGS="latest latest.${DATE} ${DATE}"
            else
              TAGS="deck-latest deck-latest.${DATE} deck-${DATE}"
            fi
          else
            if [[ "$VARIANT" == "gnome" ]]; then
              TAGS="testing"
            else
              TAGS="deck-testing"
            fi
          fi

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "first_tag=$(echo ${TAGS} | awk '{print $1}')" >> $GITHUB_OUTPUT

      # ── OCI labels ──────────────────────────────────────────────────────────
      - name: Image Metadata
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        id: metadata
        with:
          images: "${{ env.IMAGE_REGISTRY }}/${{ matrix.image_name }}"
          labels: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ github.event.repository.name }}/refs/heads/main/README.md
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.description=${{ matrix.image_desc }}
            org.opencontainers.image.documentation=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ github.event.repository.name }}/refs/heads/main/README.md
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/${{ github.event.repository.name }}/blob/main/${{ matrix.containerfile }}
            org.opencontainers.image.title=${{ matrix.image_name }}
            org.opencontainers.image.url=https://github.com/${{ github.repository_owner }}/${{ github.event.repository.name }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ steps.tags.outputs.first_tag }}.${{ steps.date.outputs.version_date }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.artifacthub.package.deprecated=false
            io.artifacthub.package.keywords=${{ env.IMAGE_KEYWORDS }}
            io.artifacthub.package.license=Apache-2.0
            io.artifacthub.package.logo-url=${{ env.IMAGE_LOGO_URL }}
            io.artifacthub.package.prerelease=false
            containers.bootc=1
          sep-tags: " "
          sep-annotations: " "

      # ── Disk space ──────────────────────────────────────────────────────────
      - name: Maximize build space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      # ── Build ────────────────────────────────────────────────────────────────
      - name: Build image
        id: build_image
        run: |
          FEDORA_VER=$(skopeo inspect docker://ghcr.io/ublue-os/${{ matrix.base_image_name }}:stable 2>/dev/null \
            | jq -r '.Labels["org.opencontainers.image.version"] // empty' \
            | grep -oP '^\d+' || echo "44")
          VERSION_DATE="${{ steps.date.outputs.version_date }}"

          sudo buildah bud \
            --format docker \
            --tag "localhost/${{ matrix.image_name }}:latest" \
            --build-arg IMAGE_NAME="${{ matrix.image_name }}" \
            --build-arg IMAGE_VENDOR="${{ github.repository_owner }}" \
            --build-arg IMAGE_BRANCH="${{ github.ref_name }}" \
            --build-arg BASE_IMAGE_NAME="${{ matrix.base_image_name }}" \
            --build-arg VERSION_DATE="${VERSION_DATE}" \
            --file ${{ matrix.containerfile }} \
            .

      # ── Cleanup pulled source images (save disk for rechunk) ─────────────
      - name: Remove source images
        run: |
          images=$(sudo podman images -n --sort repository --format '{{.ID}} {{.Repository}}' | grep -v localhost | awk '{print $1}')
          if [ -n "${images}" ]; then
            for image in ${images}; do
              echo "Removing: $image"
              sudo podman rmi --force "$image"
            done
          else
            echo "No images to remove."
          fi

      # ── Rechunk (GNOME on main only) ─────────────────────────────────────
      - name: Run Rechunker
        id: rechunk
        uses: hhd-dev/rechunk@v1.2.4
        if: matrix.rechunk && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          rechunk: "ghcr.io/hhd-dev/rechunk:v1.2.3"
          ref: "localhost/${{ matrix.image_name }}:latest"
          prev-ref: "${{ env.IMAGE_REGISTRY }}/${{ matrix.image_name }}:latest"
          skip_compression: false
          max-layers: 90
          labels: ${{ steps.metadata.outputs.labels }}

      - name: Rechunk output
        continue-on-error: true
        if: steps.rechunk.conclusion == 'success'
        run: |
          echo "=== Rechunk Changelog ==="
          [[ -f "${{ steps.rechunk.outputs.changelog }}" ]] && cat "${{ steps.rechunk.outputs.changelog }}"
          echo ""
          echo "=== Rechunk Manifest ==="
          [[ -f "${{ steps.rechunk.outputs.manifest }}" ]] && cat "${{ steps.rechunk.outputs.manifest }}"

      - name: Remove Rechunker image
        run: |
          image=$(sudo podman images -n --sort repository --format '{{.ID}} {{.Repository}}' | grep rechunk | awk '{print $1}')
          [ -n "${image}" ] && sudo podman rmi --force "$image" || echo "No rechunk image to remove."

      # ── Login ────────────────────────────────────────────────────────────────
      - name: Login to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Registry
        id: registry_case
        uses: ASzc/change-string-case-action@v8
        with:
          string: ${{ env.IMAGE_REGISTRY }}

      # ── Layer sizes ──────────────────────────────────────────────────────────
      - name: Inspect layer sizes
        run: |
          echo "=== Layer size analysis — ${{ matrix.image_name }} ==="
          sudo podman inspect localhost/${{ matrix.image_name }}:latest | \
            jq '.[0].RootFS.Layers[] | length' | \
            awk '{sum+=$1; print "Layer: " $1/1024/1024 " MB"} END {print "Total: " sum/1024/1024 " MB"}'

      # ── Push ─────────────────────────────────────────────────────────────────
      # Rechunked images (gnome + main): load from rechunk output ref, tag, push.
      # Non-rechunked (deck, or non-main branches): push directly from buildah store.
      - name: Load rechunked image
        if: steps.rechunk.conclusion == 'success'
        run: |
          IMAGE=$(podman pull ${{ steps.rechunk.outputs.ref }})
          sudo rm -rf ${{ steps.rechunk.outputs.location }}
          DEST="${{ steps.registry_case.outputs.lowercase }}/${{ matrix.image_name }}"
          for tag in ${{ steps.tags.outputs.tags }}; do
            podman tag "$IMAGE" "${DEST}:${tag}"
          done

      - name: Push rechunked image
        uses: redhat-actions/push-to-registry@5ed88d269cf581ea9ef6dd6806d01562096bee9c # v2
        if: steps.rechunk.conclusion == 'success'
        id: push_rechunked
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        with:
          registry: ${{ steps.registry_case.outputs.lowercase }}
          image: ${{ matrix.image_name }}
          tags: ${{ steps.tags.outputs.tags }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}
          extra-args: |
            --compression-format=gzip
            --compression-level=6

      - name: Push non-rechunked image
        if: steps.rechunk.conclusion != 'success' && github.event_name != 'pull_request'
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        run: |
          echo "${REGISTRY_PASSWORD}" | sudo podman login ghcr.io -u "${REGISTRY_USER}" --password-stdin
          DEST="${{ steps.registry_case.outputs.lowercase }}/${{ matrix.image_name }}"
          for tag in ${{ steps.tags.outputs.tags }}; do
            sudo podman tag "localhost/${{ matrix.image_name }}:latest" "${DEST}:${tag}"
            sudo podman push "${DEST}:${tag}" \
              --compression-format=gzip \
              --compression-level=6
          done

      # Unified digest capture for signing — skopeo inspect after push
      - name: Get image digest
        id: digest
        if: github.event_name != 'pull_request'
        run: |
          DEST="${{ steps.registry_case.outputs.lowercase }}/${{ matrix.image_name }}"
          FIRST_TAG="${{ steps.tags.outputs.first_tag }}"
          DIGEST=$(skopeo inspect --format '{{.Digest}}' "docker://${DEST}:${FIRST_TAG}")
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT

      # ── Sign ─────────────────────────────────────────────────────────────────
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request'

      - name: Sign container image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          IMAGE_FULL="${{ steps.registry_case.outputs.lowercase }}/${{ matrix.image_name }}"
          cosign sign -y --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_FULL}@${{ steps.digest.outputs.digest }}"
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}

  # ============================================================================
  # Release — GNOME variant only, main branch only
  # ============================================================================
  generate_release:
    name: Generate Release
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          fetch-depth: 500

      - name: Install skopeo
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q skopeo

      - name: Generate changelog
        id: changelog
        env:
          IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
          IMAGE_NAME: distinctionos
          HANDWRITTEN: ${{ github.event.inputs.handwritten || '' }}
        run: |
          REGISTRY="${IMAGE_REGISTRY,,}"
          IMAGE="${IMAGE_NAME,,}"
          python3 .github/workflows/changelog.py \
            "${IMAGE}" \
            ./output.env \
            ./changelog.md \
            --registry "docker://${REGISTRY}/" \
            --workdir . \
            --handwritten "${HANDWRITTEN}"

          source ./output.env
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "title=${TITLE}" >> $GITHUB_OUTPUT

          echo "## Release: ${TITLE}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat ./changelog.md >> $GITHUB_STEP_SUMMARY

      - name: Create Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v2
        with:
          name: ${{ steps.changelog.outputs.title }}
          tag_name: ${{ steps.changelog.outputs.tag }}
          body_path: ./changelog.md
          make_latest: true

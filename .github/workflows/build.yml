---
name: Build DistinctionOS
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '05 6 */10 * *'  # 12:05am Mountain time every 5 days Ref: 'minute hour day(s) Month day-of-the-week'
  push:
    branches:
      - main
      - '**'
    paths-ignore:
      - '.github/**'
      - '.claude/**'
      - '**/README.md'
      - '**/CLAUDE.md'
      - 'repo_files/**'
      - 'docs/**'
      # NOTE: system_files/** deliberately NOT ignored — those files are
      # COPY'd into the image, so changes to them MUST trigger a rebuild
      # or they sit undeployed until the next scheduled build.
  workflow_dispatch:
    inputs:
      handwritten:
        description: 'Optional handwritten changelog message for this release'
        type: string
        default: ''
      dry_run:
        description: 'Validation run — build only, no push (off=normal, build=stop after build, chunk=stop after rechunk)'
        type: choice
        options: ['off', 'build', 'chunk']
        default: 'off'
env:
  IMAGE_DESC: "My Customized Bazzite Image"
  IMAGE_KEYWORDS: "bootc,ublue,universal-blue"
  IMAGE_LOGO_URL: "https://avatars.githubusercontent.com/u/120078124?s=200&v=4"
  IMAGE_NAME: "${{ github.event.repository.name }}"  # output image name, usually same as repo name
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  DEFAULT_TAG: "latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  syntax_check:
    name: Syntax check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4

      - name: Check Just syntax
        uses: ublue-os/just-action@v3

      - name: Install linters
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q shellcheck yamllint

      # Build scripts run inside a fresh container with `set -uo pipefail`
      # and minimal tooling; a busted heredoc or unclosed `if` block here
      # wastes 20+ minutes of build time before failing. Fail fast instead.
      - name: Shellcheck build scripts
        run: |
          shopt -s nullglob
          status=0
          for f in build_files/*.sh build_files/image-info; do
            head -1 "$f" | grep -qE '^#!.*\b(bash|sh)\b' || continue
            echo "→ shellcheck $f"
            shellcheck -S error -e SC1091 "$f" || status=$?
          done
          exit $status

      # System files shipped into /etc/profile.d and /usr/bin must parse
      # cleanly — they run on every login and a broken alias bricks shells.
      - name: Shellcheck system shell files
        run: |
          shopt -s nullglob
          status=0
          for f in system_files/etc/profile.d/*.sh \
                   system_files/usr/bin/rpm-ostree-search-hl \
                   system_files/usr/bin/distinction-dnf; do
            [ -f "$f" ] || continue
            head -1 "$f" | grep -qE '^#!.*\b(bash|sh)\b' || continue
            echo "→ shellcheck $f"
            shellcheck -S error -e SC1091 -e SC2139 "$f" || status=$?
          done
          exit $status

      - name: Yamllint workflows
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: disable, truthy: disable, comments: disable, comments-indentation: disable, document-start: disable, brackets: disable, indentation: disable}}" .github/workflows/

      - name: Validate Containerfile (hadolint)
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: Containerfile
          failure-threshold: error

  build_push:
    name: Build and push image
    runs-on: ubuntu-24.04
    needs: syntax_check

    permissions:
      contents: read
      packages: write
      id-token: write

    outputs:
      digest: ${{ steps.push.outputs.digest }}

    steps:
      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4
        with:
          fetch-depth: 0  # Full history for changelog commit range

      - name: Prepare environment
        run: |
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      - name: Get current date
        id: date
        run: |
          echo "date=$(date -u +%Y\-%m\-%d\T%H\:%M\:%S\Z)" >> $GITHUB_OUTPUT

      - name: Image Metadata
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        id: metadata
        with:
          # This generates all the tags for your image, you can add custom tags here too!
          # Default tags are "$DEFAULT_TAG" and "$DEFAULT_TAG.$date".
          tags: |
            type=raw,value=${{ env.DEFAULT_TAG }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value={{date 'YYYYMMDD'}},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=testing,enable=${{ github.ref != 'refs/heads/main' && github.event_name != 'pull_request' }}
            type=raw,value=testing.{{date 'YYYYMMDD'}},enable=${{ github.ref != 'refs/heads/main' && github.event_name != 'pull_request' }}
            type=sha,enable=${{ github.event_name == 'pull_request' }}
            type=ref,event=pr
          labels: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/refs/heads/main/README.md
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.description=${{ env.IMAGE_DESC }}
            org.opencontainers.image.documentation=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/refs/heads/main/README.md
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/blob/main/Containerfile
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.url=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}}
            org.opencontainers.image.revision=${{ github.sha }}
            io.artifacthub.package.deprecated=false
            io.artifacthub.package.keywords=${{ env.IMAGE_KEYWORDS }}
            io.artifacthub.package.license=Apache-2.0
            io.artifacthub.package.logo-url=${{ env.IMAGE_LOGO_URL }}
            io.artifacthub.package.prerelease=false
            containers.bootc=1
          sep-tags: " "
          sep-annotations: " "

      - name: Maximize build space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      # GHA runners ship with a small root partition and a much larger
      # ephemeral /mnt. Default overlay-on-ext4 storage saturates root
      # disk headroom mid-chunk on big layered images; switching
      # /var/lib/containers to BTRFS on /mnt buys us the headroom and
      # lets the chunker use reflinks instead of full file copies.
      - name: Check if /mnt is mounted
        id: check_mnt
        run: |
          if sudo mountpoint /mnt; then
            echo "mnt_is_there=1" >> "$GITHUB_OUTPUT"
          else
            echo "mnt_is_there=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Mount BTRFS for podman storage
        uses: ublue-os/container-storage-action@main
        if: ${{ steps.check_mnt.outputs.mnt_is_there == '1' }}
        with:
          target-dir: /var/lib/containers

      - name: Build image (rootful)
        id: build_image
        run: |
          FEDORA_VER=$(skopeo inspect docker://ghcr.io/ublue-os/bazzite-gnome:testing 2>/dev/null \
            | jq -r '.Labels["org.opencontainers.image.version"] // empty' \
            | grep -oP '^\d+' || echo "44")
          VERSION_DATE=$(date -u +%Y%m%d)
          # GITHUB_TOKEN as a build secret: lets build scripts make
          # authenticated GitHub API calls (e.g. Kora release lookup) without
          # the anonymous per-IP rate limit shared across GHA runners.
          # Secret mounts never persist in image layers, unlike --build-arg.
          install -m 0600 /dev/null /tmp/.ghtoken
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" > /tmp/.ghtoken
          # Builds image in root store as root, to be picked up by Rechunker
          sudo buildah bud \
            --format docker \
            --secret id=github_token,src=/tmp/.ghtoken \
            --tag "localhost/${IMAGE_NAME}:${{ env.DEFAULT_TAG }}" \
            --build-arg IMAGE_NAME="${IMAGE_NAME}" \
            --build-arg IMAGE_VENDOR="${{ github.repository_owner }}" \
            --build-arg IMAGE_BRANCH="${{ github.ref_name }}" \
            --build-arg BASE_IMAGE_NAME="bazzite-gnome" \
            --build-arg VERSION_DATE="${VERSION_DATE}" \
            --file Containerfile \
            .
          rm -f /tmp/.ghtoken

      - name: Remove source images
        run: |
          images=$(sudo podman images -n --sort repository --format '{{.ID}} {{.Repository}}' | grep -v localhost | awk '{print $1}')
          if [ -n "${images}" ]; then
            for image in ${images}; do
              echo "Removing image: $image"
              sudo podman rmi --force "$image"
            done
          else
            echo "No images to remove."
          fi

      # The native chunker (rpm-ostree compose build-chunked-oci) doesn't
      # accept --label, so labels and annotations have to be baked into
      # the raw image before chunking. metadata-action emits labels
      # newline-separated by default; we apply each via `buildah config`.
      - name: Apply OCI labels to raw image
        if: github.event_name != 'pull_request'
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DEFAULT_TAG: ${{ env.DEFAULT_TAG }}
          LABELS: ${{ steps.metadata.outputs.labels }}
        run: |
          SRC="localhost/${IMAGE_NAME}:${DEFAULT_TAG}"
          container=$(sudo buildah from "$SRC")
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            sudo buildah config --label "$line" --annotation "$line" "$container"
          done <<< "${LABELS}"

          # The native chunker doesn't emit dev.hhd.rechunk.info the way the
          # old hhd-dev/rechunk action did, so changelog.py loses its package
          # list. Rebuild that label from the image's RPM database here.
          pkgs_json=$(sudo buildah run "$container" -- \
            rpm -qa --qf '%{NAME}\t%{VERSION}-%{RELEASE}\n' \
            | python3 -c 'import sys, json; print(json.dumps({"packages": dict(l.split("\t", 1) for l in sys.stdin.read().splitlines() if "\t" in l)}))')
          sudo buildah config --label "dev.hhd.rechunk.info=${pkgs_json}" "$container"

          sudo buildah commit --identity-label=false --rm "$container" "$SRC"

      # Native chunker: invokes `rpm-ostree compose build-chunked-oci`
      # from inside the freshly built image itself, against the same
      # image as input. Produces format-version 2 chunked OCI output —
      # smaller per-update deltas for end users than the v1 format the
      # hhd-dev/rechunk action emits. See docs/bazzite-pipeline-investigation.md.
      - name: Run native rechunker
        id: rechunk
        if: github.event_name != 'pull_request' && inputs.dry_run != 'build'
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DEFAULT_TAG: ${{ env.DEFAULT_TAG }}
        run: |
          SRC="localhost/${IMAGE_NAME}:${DEFAULT_TAG}"
          DST="localhost/${IMAGE_NAME}-chunked:${DEFAULT_TAG}"

          sudo podman run --rm --privileged \
            --volume /var/lib/containers:/var/lib/containers \
            "$SRC" \
            rpm-ostree compose build-chunked-oci \
              --bootc --max-layers 127 --format-version 2 \
              --from "$SRC" \
              --output "containers-storage:${DST}"

          # Free the raw image — it doubled the on-disk footprint and
          # the chunked variant is now the canonical artifact.
          sudo podman rmi --force "$SRC" || true

          echo "ref=containers-storage:${DST}" >> "$GITHUB_OUTPUT"
          echo "dst=${DST}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          # Two logins because the pipeline straddles two auth scopes:
          #   * sudo podman / sudo skopeo (the chunked image lives in
          #     rootful containers-storage) → root's auth.json.
          #   * cosign / oras / any rootless tool that reads
          #     ~/.docker/config.json → runner user's config.
          # Skipping either one fails a downstream step with
          # "UNAUTHORIZED" instead of a useful message.
          echo "${GITHUB_TOKEN}" | sudo podman login ghcr.io \
            -u "${GITHUB_ACTOR}" --password-stdin
          echo "${GITHUB_TOKEN}" | docker login ghcr.io \
            -u "${GITHUB_ACTOR}" --password-stdin

      - name: Lowercase Registry
        id: registry_case
        uses: ASzc/change-string-case-action@v8
        with:
          string: ${{ env.IMAGE_REGISTRY }}

      - name: Inspect layer sizes
        if: github.event_name != 'pull_request' && inputs.dry_run != 'build'
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DEFAULT_TAG: ${{ env.DEFAULT_TAG }}
        run: |
          echo "=== Layer size analysis (chunked) ==="
          sudo podman inspect "localhost/${IMAGE_NAME}-chunked:${DEFAULT_TAG}" \
            | jq '.[0].RootFS.Layers[] | length' \
            | awk '{sum+=$1; print "Layer size: " $1/1024/1024 " MB"} END {print "Total: " sum/1024/1024 " MB"}'

      - name: Install skopeo
        if: github.event_name != 'pull_request'
        run: |
          if ! command -v skopeo >/dev/null 2>&1; then
            sudo apt-get update -q
            sudo apt-get install -y -q skopeo
          fi

      # Pushes are retried because GHCR routinely returns transient
      # 5xx / EOF / connection-reset errors mid-push, especially for
      # multi-hundred-MB layered images. Matches Bazzite's pattern.
      # Note: sudo skopeo — the chunked image lives in rootful storage.
      - name: Push To GHCR
        if: github.event_name != 'pull_request' && (inputs.dry_run == '' || inputs.dry_run == 'off')
        id: push
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          IMAGE_REGISTRY: ${{ env.IMAGE_REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DEFAULT_TAG: ${{ env.DEFAULT_TAG }}
          TAGS: ${{ steps.metadata.outputs.tags }}
        with:
          max_attempts: 3
          retry_wait_seconds: 15
          timeout_minutes: 20
          command: |
            log_sum() { echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
            log_sum '# Push to GHCR result'
            log_sum '```'
            DIGEST=""
            for tag in ${TAGS}; do
              dest="${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}"
              sudo skopeo copy \
                --digestfile=/tmp/digestfile \
                --dest-compress-format=gzip \
                --dest-compress-level=6 \
                "containers-storage:localhost/${IMAGE_NAME}-chunked:${DEFAULT_TAG}" \
                "docker://${dest}"
              log_sum "${dest}"
              DIGEST="$(sudo cat /tmp/digestfile)"
            done
            log_sum '```'
            echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      # This section is optional and only needs to be enabled if you plan on distributing
      # your project for others to consume. You will need to create a public and private key
      # using Cosign and save the private key as a repository secret in Github for this workflow
      # to consume. For more details, review the image signing section of the README.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request'

      - name: Sign container image
        id: sign_container_image
        if: github.event_name != 'pull_request' && (inputs.dry_run == '' || inputs.dry_run == 'off')
        run: |
          echo "${STEPS_PUSH_OUTPUTS_REGISTRY_PATHS}"
          IMAGE_FULL="${STEPS_REGISTRY_CASE_OUTPUTS_LOWERCASE}/${IMAGE_NAME}"
          cosign sign -y --key env://COSIGN_PRIVATE_KEY $IMAGE_FULL@"${STEPS_PUSH_OUTPUTS_DIGEST}"
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          STEPS_PUSH_OUTPUTS_REGISTRY_PATHS: ${{ steps.push.outputs.registry-paths }}
          STEPS_REGISTRY_CASE_OUTPUTS_LOWERCASE: ${{ steps.registry_case.outputs.lowercase }}
          STEPS_PUSH_OUTPUTS_DIGEST: ${{ steps.push.outputs.digest }}

  generate_release:
    name: Generate Release
    needs: build_push
    # main → full release (changelog.py, make_latest)
    # testing → pre-release with minimal body (auto-cleaned by clean-prereleases.yml)
    if: github.event_name != 'pull_request' && (inputs.dry_run == '' || inputs.dry_run == 'off') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4
        with:
          fetch-depth: 500  # Deep history for commit range in changelog

      - name: Install skopeo
        if: github.ref == 'refs/heads/main'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q skopeo

      - name: Generate changelog (main)
        id: changelog_main
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
          IMAGE_NAME: ${{ github.event.repository.name }}
          HANDWRITTEN: ${{ github.event.inputs.handwritten || '' }}
        run: |
          REGISTRY="${IMAGE_REGISTRY,,}"
          IMAGE="${IMAGE_NAME,,}"
          python3 .github/workflows/changelog.py \
            "${IMAGE}" \
            ./output.env \
            ./changelog.md \
            --registry "docker://${REGISTRY}/" \
            --workdir . \
            --handwritten "${HANDWRITTEN}"

          # Source the env file for tag and title
          source ./output.env
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "title=${TITLE}" >> $GITHUB_OUTPUT

          # Show in job summary
          echo "## Release: ${TITLE}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat ./changelog.md >> $GITHUB_STEP_SUMMARY

      # changelog.py diffs the two most recent `latest.*` tags and reads the
      # `dev.hhd.rechunk.info` label — neither makes sense for a per-commit
      # testing build, so we emit a minimal release body here. Tag is unique
      # per build so the clean-prereleases job can sweep it without colliding.
      - name: Generate changelog (testing pre-release)
        id: changelog_testing
        if: github.ref == 'refs/heads/testing'
        env:
          IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
          IMAGE_NAME: ${{ github.event.repository.name }}
          HANDWRITTEN: ${{ github.event.inputs.handwritten || '' }}
        run: |
          REGISTRY="${IMAGE_REGISTRY,,}"
          IMAGE="${IMAGE_NAME,,}"
          SHA_SHORT="${GITHUB_SHA:0:7}"
          STAMP="$(date -u +%Y%m%d-%H%M%S)"
          TAG="testing-${STAMP}-${SHA_SHORT}"
          TITLE="Testing build ${STAMP} (${SHA_SHORT})"

          {
            echo "# Testing pre-release"
            echo
            echo "Automated pre-release of the \`testing\` branch. Same build pipeline as \`:latest\`, but not promoted. **Auto-cleaned after a few days.**"
            echo
            echo "**Commit:** \`${GITHUB_SHA}\`  "
            echo "**Image:** \`${REGISTRY}/${IMAGE}:testing\`  "
            echo "**Dated tag:** \`${REGISTRY}/${IMAGE}:testing.$(date -u +%Y%m%d)\`"
            echo
            echo '## Try it'
            echo
            echo '```bash'
            echo "sudo bootc switch ${REGISTRY}/${IMAGE}:testing"
            echo '```'
            echo
            echo "If something breaks, roll back with \`sudo bootc rollback\`."
            if [[ -n "${HANDWRITTEN}" ]]; then
              echo
              echo '## Notes'
              echo
              echo "${HANDWRITTEN}"
            fi
          } > ./changelog.md

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"

          echo "## Pre-release: ${TITLE}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat ./changelog.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v2
        with:
          name: ${{ steps.changelog_main.outputs.title || steps.changelog_testing.outputs.title }}
          tag_name: ${{ steps.changelog_main.outputs.tag || steps.changelog_testing.outputs.tag }}
          body_path: ./changelog.md
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          make_latest: ${{ github.ref == 'refs/heads/main' }}

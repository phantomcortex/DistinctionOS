name: Build Cache RPM Artifact

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  build-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push cache artifact image
        uses: docker/build-push-action@v7
        with:
          context: .github/cache-builder/
          file: .github/cache-builder/Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/phantomcortex/distinctionos-cache:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: Build Cache RPM Artifact

on:
  schedule:
    # Every 15 days at 06:00 UTC — deliberately slower than build.yml /
    # build-force-install.yml (both 10d). The cache artifact's upstream
    # sources rarely change, and the reusable workflow self-checks
    # (inspect → decide) before rebuilding regardless of cron, so this
    # is just the "look and probably skip" heartbeat. `max_age_days`
    # below is the real freshness ceiling.
    - cron: '0 6 */30 * *'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Rebuild even if versions match and age <= max_age_days'
        type: boolean
        default: false
  workflow_call:
    inputs:
      force_rebuild:
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: ./.github/workflows/_build-oci-artifact.yml
    with:
      image: ghcr.io/phantomcortex/distinctionos-cache
      builder_dir: .github/cache-builder
      version_check_tag: cache-version-check
      max_age_days: 15
      force_rebuild: ${{ inputs.force_rebuild || false }}
    secrets: inherit

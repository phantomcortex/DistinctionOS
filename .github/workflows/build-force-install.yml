name: Build Force-Install RPM Artifact

on:
  schedule:
    # Every 10 days at 06:30 UTC (offset 25min from build.yml to avoid
    # contention).
    - cron: '30 6 */10 * *'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Rebuild even if versions match and age <= max_age_days'
        type: boolean
        default: false
  workflow_call:
    inputs:
      force_rebuild:
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: ./.github/workflows/_build-oci-artifact.yml
    with:
      image: ghcr.io/phantomcortex/distinctionos-force-install
      builder_dir: .github/force-install-builder
      version_check_tag: force-install-version-check
      max_age_days: 15
      force_rebuild: ${{ inputs.force_rebuild || false }}
    secrets: inherit
